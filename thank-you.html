<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thank You — John's Masonry and Roofing</title>
    <link rel="icon" type="image/png" href="/favicontommy.png">
    <meta name="description" content="Thank you for contacting John's Masonry and Roofing. We'll get back to you as soon as possible." />
    <meta name="theme-color" content="#1f2937" />
    <meta name="robots" content="noindex, follow" />

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"></noscript>
    <link rel="stylesheet" href="/assets/site.css?v=20260810c">
    <script>
        // Blocking on purpose: sets the theme before first paint. See assets/theme.js.
        (() => {
            try {
                const saved = localStorage.getItem('johns-masonry-roofing-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.dataset.theme = saved;
                }
            } catch { /* fall through to the OS preference in CSS */ }
        })();
    </script>
    <style>
        /* This page is a single centred panel; everything else comes from site.css. */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            max-width: 700px;
            text-align: center;
            padding: 40px 28px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
        }

        h1 {
            font-family: Montserrat, sans-serif;
            font-size: 30px;
            margin: 0 0 16px;
            color: var(--accent-ink);
        }

        .wrap p {
            color: var(--text-soft);
            font-size: 16px;
            margin: 0 0 12px;
        }

        .ctas {
            justify-content: center;
            margin-top: 26px;
        }

        footer {
            border-top: none;
            margin-top: 36px;
            font-size: 13px;
        }
    </style>
    <link rel="stylesheet" href="/accessibility.css?v=20260810c">
    <script src="/accessibility.js?v=20260730" defer></script>
    <script src="/assets/theme.js?v=20260810c" defer></script>
    <script src="/languages.js?v=20260810" defer></script>
</head>

<body>
    <div class="wrap">
        <div class="logo" aria-hidden="true">JM</div>
        <h1>Thank You!</h1>
        <p>Your request has been received. A member of the John's Masonry and Roofing team will reach out soon to schedule your inspection or estimate.</p>
        <p>Need immediate help? Call us now.</p>

        <div class="ctas">
            <a class="btn-primary" href="tel:3124853837">Call: 312.485.3837</a>
            <a class="btn-ghost" href="/">Back to Home</a>
        </div>

        <footer>© <span id="year"></span> John's Masonry and Roofing — Serving Chicago &amp; the South Suburbs</footer>
    </div>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>

</html>
